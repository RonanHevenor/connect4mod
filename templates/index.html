<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect 4 AI Battle Arena</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="title">⚡ Connect 4 AI Battle Arena ⚡</h1>
            <p class="subtitle">Watch AIs battle for supremacy</p>
        </header>

        <div class="scoreboard">
            <div class="player-card player1">
                <div class="player-icon">🤖</div>
                <div class="player-info">
                    <h3>Random AI</h3>
                    <p class="player-status" id="player1-status">Waiting...</p>
                </div>
            </div>

            <div class="vs-badge">VS</div>

            <div class="player-card player2">
                <div class="player-icon">🧠</div>
                <div class="player-info">
                    <h3>Minimax AI</h3>
                    <p class="player-status" id="player2-status">Waiting...</p>
                </div>
            </div>
        </div>

        <div class="game-controls">
            <button id="start-btn" class="btn btn-primary">Start New Game</button>
            <button id="reset-btn" class="btn btn-secondary">Reset Board</button>
        </div>

        <div class="game-board-container">
            <div id="game-board" class="game-board">
                <!-- Board will be generated by JavaScript -->
            </div>
        </div>

        <div class="game-info">
            <div class="info-panel">
                <h3>Game Status</h3>
                <p id="game-status" class="status-text">Ready to start</p>
            </div>
            <div class="info-panel">
                <h3>Move Count</h3>
                <p id="move-count" class="status-text">0</p>
            </div>
        </div>

        <div class="move-history-container">
            <h3>Move History</h3>
            <div id="move-history" class="move-history"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='game.js') }}"></script>
</body>
</html>
