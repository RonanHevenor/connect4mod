<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect 4 AI Battle</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Configuration Screen -->
        <div id="config-screen" class="screen active">
            <div class="config-panel">
                <h1 class="title" style="text-align: center; margin-bottom: 30px;">Connect 4 AI Battle</h1>

                <div class="config-section">
                    <h3>Mode</h3>
                    <div class="mode-selector">
                        <label class="mode-option">
                            <input type="radio" name="game-mode" value="single" checked>
                            <span class="mode-label">Single Game</span>
                            <span class="mode-desc">Play one game at a time</span>
                        </label>
                        <label class="mode-option">
                            <input type="radio" name="game-mode" value="tournament">
                            <span class="mode-label">Tournament Mode</span>
                            <span class="mode-desc">Run multiple games and track wins</span>
                        </label>
                    </div>
                </div>

                <div class="config-section" id="tournament-settings" style="display: none;">
                    <h3>Tournament Settings</h3>
                    <div class="input-group">
                        <label for="num-games">Number of Games</label>
                        <input type="number" id="num-games" class="input-field" value="10" min="2" max="100" step="1">
                    </div>
                    <div class="input-group">
                        <label for="game-interval">Interval Between Games (seconds)</label>
                        <input type="number" id="game-interval" class="input-field" value="3" min="0" max="10" step="0.5">
                    </div>
                </div>

                <div class="config-section">
                    <h3>Player 1</h3>
                    <div class="input-group">
                        <label for="player1-name">Name</label>
                        <input type="text" id="player1-name" class="input-field" value="Random AI">
                    </div>
                    <div class="input-group">
                        <label for="player1-url">Webhook URL</label>
                        <input type="text" id="player1-url" class="input-field" value="http://localhost:5001/move">
                    </div>
                    <div class="input-group">
                        <label for="player1-color">Color</label>
                        <input type="color" id="player1-color" class="color-picker" value="#FF6B6B">
                    </div>
                </div>

                <div class="config-section">
                    <h3>Player 2</h3>
                    <div class="input-group">
                        <label for="player2-name">Name</label>
                        <input type="text" id="player2-name" class="input-field" value="Minimax AI">
                    </div>
                    <div class="input-group">
                        <label for="player2-url">Webhook URL</label>
                        <input type="text" id="player2-url" class="input-field" value="http://localhost:5002/move">
                    </div>
                    <div class="input-group">
                        <label for="player2-color">Color</label>
                        <input type="color" id="player2-color" class="color-picker" value="#4ECDC4">
                    </div>
                </div>

                <div class="config-section">
                    <h3>Game Settings</h3>
                    <div class="input-group">
                        <label for="move-delay">Move Delay (seconds)</label>
                        <input type="number" id="move-delay" class="input-field" value="1.5" min="0.5" max="5" step="0.5">
                    </div>
                </div>

                <div class="config-actions">
                    <button id="start-battle-btn" class="btn btn-primary">Start Battle</button>
                </div>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <header>
                <h1 class="title">Connect 4 AI Battle</h1>

                <!-- Tournament Bar (hidden in single game mode) -->
                <div id="tournament-bar" class="tournament-bar" style="display: none;">
                    <div class="election-container">
                        <div class="election-bar">
                            <div class="election-left" id="election-left">
                                <span class="election-percent" id="election-left-percent">0%</span>
                            </div>
                            <div class="election-center"></div>
                            <div class="election-right" id="election-right">
                                <span class="election-percent" id="election-right-percent">0%</span>
                            </div>
                        </div>
                    </div>
                    <div class="tournament-info">
                        <span id="tournament-progress">Game 0 of 0</span>
                    </div>
                </div>

                <div class="scoreboard">
                    <div class="player-info">
                        <div class="player-name" id="player1-display-name">Random AI</div>
                        <div class="player-status" id="player1-status">Waiting</div>
                        <!-- Ball pit for wins -->
                        <div class="ball-pit" id="player1-balls"></div>
                    </div>
                    <div class="vs">vs</div>
                    <div class="player-info">
                        <div class="player-name" id="player2-display-name">Minimax AI</div>
                        <div class="player-status" id="player2-status">Waiting</div>
                        <!-- Ball pit for wins -->
                        <div class="ball-pit" id="player2-balls"></div>
                    </div>
                </div>
            </header>

            <div class="game-main">
                <div class="game-board-container">
                    <div id="game-board" class="game-board"></div>
                </div>

                <div class="game-sidebar">
                    <div class="game-info">
                        <div class="info-grid">
                            <div class="info-item">
                                <span class="info-label">Status</span>
                                <span id="game-status" class="info-value">Ready</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Moves</span>
                                <span id="move-count" class="info-value">0</span>
                            </div>
                        </div>
                    </div>

                    <div class="game-controls">
                        <button id="new-game-btn" class="btn btn-secondary">New</button>
                        <button id="reset-btn" class="btn btn-secondary">Reset</button>
                        <button id="back-config-btn" class="btn btn-secondary">Config</button>
                    </div>

                    <div class="move-history-container">
                        <div class="move-history-title">Move History</div>
                        <div id="move-history" class="move-history"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='game.js') }}"></script>
</body>
</html>
